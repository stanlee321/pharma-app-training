name: PharmaApp
options:
  bundleIdPrefix: com.pharma
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

targets:
  PharmaApp:
    type: application
    platform: iOS
    sources:
      - path: PharmaApp
        excludes:
          - "Resources/MockData"
    resources:
      - path: PharmaApp/Resources
        includes:
          - "*.json"
          - "*.xcassets"
          - "MockData/*.json"
    info:
      path: PharmaApp/Info.plist
      properties:
        CFBundleDisplayName: TivaTrainer
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Allow cleartext HTTP to localhost/LAN for the dev backend (http://127.0.0.1:8000).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_BUNDLE_IDENTIFIER: com.pharma.tivatrainer
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 923BHPTBX7
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 2
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
