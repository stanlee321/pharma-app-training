# One origin for the SPA and the API: the browser only ever talks to this server (localhost:5174,
# or a tunnel such as ngrok in front of it), so there is no CORS and no "localhost backend" problem.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # FastAPI keeps its /api/v1 prefix — pass the path through unchanged.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Never forward the legacy gateway identity headers from the public side.
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-User-Created-By "";
        proxy_read_timeout 120s;   # finalize renders 4 PDFs
        client_max_body_size 5m;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # Hashed build assets can be cached forever; index.html never.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: client-side routes (/cases/…, /admin/…) all serve index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
